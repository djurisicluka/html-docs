name: Finalize Etno owner portrait

on:
  push:
    paths:
      - '.github/workflows/finalize-etno-owner.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install approved owner portrait and clean markup
        shell: bash
        run: |
          set -euo pipefail

          cd etno-kuca-gracanica
          cat .owner-upload2/part* | tr -d '\r\n ' | base64 --decode > owner.webp
          test "$(wc -c < owner.webp | tr -d ' ')" = "35790"
          echo "995b856fabcbd4c64c6ff3fd34a188ec65e8a91bf8e1d04404c6db34574ad2fe  owner.webp" | sha256sum -c -
          cd ..

          python - <<'PY'
          from pathlib import Path

          p = Path('etno-kuca-gracanica/index.html')
          s = p.read_text()

          old_css = '''.owner-zone{position:relative;max-width:390px;margin:12px auto 8px;padding-top:6px}
          .owner-halo{
            width:min(82vw,340px);aspect-ratio:1/1.03;margin:0 auto;
            position:relative;border-radius:48% 48% 46% 46%;
            background:
              radial-gradient(circle at 50% 42%,#83984d 0 45%,#637736 46% 58%,transparent 59%);
          }
          .owner-img{
            position:absolute;inset:0;
            width:100%;height:100%;object-fit:cover;object-position:54% 42%;
            clip-path:ellipse(43% 48% at 53% 53%);
            filter:saturate(.96) contrast(1.03);
          }'''

          new_css = '''.owner-zone{
            position:relative;
            max-width:360px;
            margin:14px auto 10px;
            padding:0 8px;
          }
          .owner-halo{
            width:min(76vw,300px);
            margin:0 auto;
            position:relative;
            overflow:hidden;
            border-radius:28px;
            background:#fff;
            border:3px solid rgba(104,121,54,.28);
            box-shadow:0 14px 34px rgba(63,35,17,.14);
          }
          .owner-img{
            display:block;
            width:100%;
            height:auto;
          }'''

          if old_css not in s:
              raise SystemExit('Expected owner CSS block not found')
          s = s.replace(old_css, new_css, 1)

          old_desktop = '''  .owner-zone{margin:0;max-width:440px}
            .owner-halo{width:min(38vw,410px)}'''
          new_desktop = '''  .owner-zone{margin:0;max-width:420px}
            .owner-halo{width:min(34vw,340px)}'''
          if old_desktop not in s:
              raise SystemExit('Expected desktop owner CSS not found')
          s = s.replace(old_desktop, new_desktop, 1)

          old_img = '<img class="owner-img" alt="Cartoon portrait of the restaurant owner" src="./owner.webp">'
          new_img = '<img class="owner-img" alt="Portrait of the restaurant owner" src="./owner.webp?v=20260820" width="1122" height="1402" decoding="async" fetchpriority="high">'
          if old_img not in s:
              raise SystemExit('Expected owner image tag not found')
          s = s.replace(old_img, new_img, 1)

          p.write_text(s)
          PY

          rm -rf etno-kuca-gracanica/.owner-upload etno-kuca-gracanica/.owner-upload2
          rm -f etno-kuca-gracanica/owner-upload-placeholder.txt
          rm -f etno-kuca-gracanica/owner.jpg.b64
          rm -f action-test.txt
          rm -f .github/workflows/action-test.yml
          rm -f .github/workflows/finalize-etno-owner.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use approved owner portrait in Etno calculator"
          git push origin HEAD:main

# retry after verified chunks
